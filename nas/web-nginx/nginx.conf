server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Archivos con hash de Vite: se pueden cachear sin límite.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Montados desde el NAS (ver nas/docker-compose.web.yml).
    location /galeria/ {
        try_files $uri $uri/ =404;
    }
    location /catalogo/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Portal de selección de fotos: solo esta ruta de ProStock llega a internet.
    # El backend está en la red iridiscencia-web-net (ver prostock-compose).
    location /api/seleccion/ {
        resolver 127.0.0.11 valid=30s;
        set $prostock http://prostock-irisdicencia-backend-1:8080;
        rewrite ^/api/seleccion/(.*)$ /api/public/selection/$1 break;
        proxy_pass $prostock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Set-Cookie;
        client_max_body_size 256k;
        proxy_read_timeout 60s;
    }

    # Sveltia CMS
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # SPA de una sola página: index.html siempre fresco para tomar el último build.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
