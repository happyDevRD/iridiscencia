server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Archivos con hash de Vite: se pueden cachear sin límite.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Montados desde el NAS (ver nas/docker-compose.web.yml).
    location /galeria/ {
        try_files $uri $uri/ =404;
    }
    location /catalogo/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Sveltia CMS
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # SPA de una sola página: index.html siempre fresco para tomar el último build.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
