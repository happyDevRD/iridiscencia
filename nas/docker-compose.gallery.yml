services:
  gallery-nginx:
    image: nginx:alpine
    container_name: iridiscencia-gallery-nginx
    restart: unless-stopped
    volumes:
      - /volume1/Galeria:/usr/share/nginx/html/galeria:ro
      - ./gallery-nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web
    mem_limit: 32m

  gallery-sync:
    build: ./gallery-sync
    container_name: iridiscencia-gallery-sync
    restart: unless-stopped
    volumes:
      - /volume1/Galeria:/galeria
    mem_limit: 48m
    network_mode: none

networks:
  web:
    name: iridiscencia-web-net
