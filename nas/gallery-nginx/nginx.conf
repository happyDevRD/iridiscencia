server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Habilita CORS solo en la galería: el sitio (Cloudflare Pages) y la
    # galería (este contenedor) viven en orígenes distintos, y el fetch()
    # de manifest.json necesita la cabecera para no ser bloqueado.
    location /galeria/ {
        add_header Access-Control-Allow-Origin "https://iridiscencia.com" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        try_files $uri $uri/ =404;
    }

    # Catálogo público que exporta ProStock (catalogo-export en el stack
    # prostock-irisdicencia). Ver docs/prostock-catalogo.md.
    location /catalogo/ {
        add_header Access-Control-Allow-Origin "https://iridiscencia.com" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
}
